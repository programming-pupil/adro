name: Browser

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright browser matrix
    runs-on: ubuntu-latest
    env:
      ADRO_E2E_EXECUTOR: ${{ github.workspace }}/scripts/e2e-executor.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:matrix
