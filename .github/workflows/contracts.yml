name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: API and asset contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --check e2e/static-server.js
      - run: node --check e2e/workbench.spec.js
      - run: node --check e2e/visuals.spec.js
      - run: node --check e2e/platform-matrix.spec.js
      - run: node --check apps/web/enhancements.js
      - run: node --check scripts/release-assets.mjs
      - run: node --check scripts/architecture-score.mjs
      - run: node --check scripts/fault-matrix.mjs
      - run: bash -n scripts/orchestration-guard.sh
      - run: ./scripts/orchestration-guard.sh
      - name: Enforce independent project identity
        run: |
          ./scripts/test-public-identity.py
          ./scripts/verify-public-identity.py
      - run: node scripts/check-html.mjs
      - run: ruby scripts/openapi-contract.rb
      - run: ./scripts/verify-rebuild-ledger.py
      - run: ./scripts/verify-threat-test-map.py
      - run: bash -n examples/three-repo-feign/run.sh
      - run: ruby -rjson -e 'require "yaml"; YAML.load_file("openapi/openapi.yaml"); JSON.parse(File.read("release/dependencies.json")); JSON.parse(File.read("SBOM"))'
