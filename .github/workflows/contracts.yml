name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: API, HTML, startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check e2e/static-server.js
      - run: node --check e2e/workbench.spec.js
      - run: node --check e2e/visuals.spec.js
      - run: node --check e2e/platform-matrix.spec.js
      - run: node --check playwright.config.js
      - run: node --check playwright.matrix.config.js
      - run: node --check apps/web/enhancements.js
      - run: node --check scripts/release-assets.mjs
      - run: node scripts/check-html.mjs
      - run: ruby scripts/openapi-contract.rb
      - run: ruby -e 'require "yaml"; YAML.load_file("openapi/openapi.yaml"); YAML.load_file("deploy/compose/docker-compose.yml"); YAML.load_file("charts/adro/values.yaml"); JSON.parse(File.read("charts/adro/values.schema.json")); JSON.parse(File.read("release/dependencies.json")); JSON.parse(File.read("SBOM"))'
      - run: bash -n examples/three-repo-feign/run.sh
      - run: bash -n start.sh
      - run: test -x start.sh
      - run: ./start.sh --help
      - run: ./scripts/test-start-permissions.sh
