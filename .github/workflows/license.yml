name: License

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    name: SPDX SBOM and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/release-assets.mjs verify
