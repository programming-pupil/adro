name: Real Codex system acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# Real-provider acceptance is opt-in because it consumes provider tokens and
# requires credentials on a controlled self-hosted runner. Push and pull-request
# gates remain reproducible for public contributors without private credentials.
jobs:
  real-codex:
    name: Native Codex system and pipeline E2E
    runs-on: [self-hosted, adro-codex]
    timeout-minutes: 45
    env:
      ADRO_REQUIRE_CODEX: '1'
      ADRO_EXECUTOR: codex
      ADRO_EXECUTOR_COMMAND: ${{ secrets.ADRO_CODEX_COMMAND }}
      ADRO_AUTH_MODE: optional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Verify Codex prerequisite
        run: |
          command -v codex
          codex --version
          test -n "$ADRO_EXECUTOR_COMMAND"
      - name: Run complete real system acceptance
        run: make test-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-codex-evidence
          path: var/test-report/real-codex
