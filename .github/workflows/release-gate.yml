name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-quality:
    name: Go quality and fault matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: scripts/e2e-go.sh test ./... -count=1 -p 1
      - run: scripts/e2e-go.sh test -race ./... -count=1 -p 1
      - run: scripts/e2e-go.sh vet ./...
      - run: scripts/e2e-go.sh build ./...
      - run: make fault-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-fault-matrix
          path: var/test-report/fault-matrix

  contracts-supply-chain:
    name: Contracts and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make contracts
      - run: make supply-chain

  browser:
    name: Browser ADRO and platform matrix
    runs-on: ubuntu-latest
    env:
      ADRO_E2E_EXECUTOR: ${{ github.workspace }}/scripts/e2e-executor.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:adro
      - run: npm run test:e2e:matrix

  postgres:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADRO_POSTGRES_TEST_DSN: postgres://adro_app:adro_test@127.0.0.1:5432/adro_test?sslmode=disable
      ADRO_POSTGRES_BACKUP_DSN: postgres://adro_backup:adro_backup@127.0.0.1:5432/adro_test?sslmode=disable
      ADRO_POSTGRES_ADMIN_DSN: postgres://postgres:postgres_admin@127.0.0.1:5432/postgres?sslmode=disable
      ADRO_POSTGRES_RESTORE_DSN: postgres://adro_app:adro_test@127.0.0.1:5432/adro_restore?sslmode=disable
      ADRO_POSTGRES_RESTORE_DB: adro_restore
      ADRO_POSTGRES_EVIDENCE_DIR: var/test-report/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Create least-privilege test roles
        env:
          PGPASSWORD: postgres_admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE adro_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'adro_test';
          CREATE ROLE adro_backup LOGIN NOSUPERUSER BYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'adro_backup';
          CREATE DATABASE adro_test OWNER adro_app;
          SQL
      - run: make postgres-conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-postgres
          path: var/test-report/postgres

  release-gate:
    name: Required release gate
    if: always()
    needs: [go-quality, contracts-supply-chain, browser, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release signal
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success"
