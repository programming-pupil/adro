name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version and tag
        run: |
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: make test test-race vet build architecture fuzz-smoke store-conformance supply-chain
      - name: Build source archive
        run: |
          version="$(cat VERSION)"
          mkdir -p dist
          git archive --format=tar.gz --prefix="adro-$version/" "$GITHUB_REF_NAME" -o "dist/adro-$version.tar.gz"
          python3 scripts/release-assets.py manifest --output dist/release-manifest.json
      - name: Sign and verify release manifest
        env:
          ADRO_RELEASE_SIGNING_KEY_B64: ${{ secrets.ADRO_RELEASE_SIGNING_KEY_B64 }}
        run: |
          test -n "$ADRO_RELEASE_SIGNING_KEY_B64"
          umask 077
          printf '%s' "$ADRO_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/adro-release-key"
          python3 scripts/release-assets.py sign-manifest dist/release-manifest.json \
            --key "$RUNNER_TEMP/adro-release-key" \
            --signature dist/release-manifest.json.sig \
            --allowed-signers dist/release-allowed-signers
          python3 scripts/release-assets.py verify-manifest dist/release-manifest.json
          python3 scripts/release-assets.py verify-signature dist/release-manifest.json \
            --signature dist/release-manifest.json.sig \
            --allowed-signers dist/release-allowed-signers
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
