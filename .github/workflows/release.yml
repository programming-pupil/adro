name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    env:
      ADRO_E2E_EXECUTOR: ${{ github.workspace }}/scripts/e2e-executor.sh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check version and tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: make verify
      - name: Build source archive
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist
          git archive --format=tar.gz --prefix="adro-$version/" "$GITHUB_REF_NAME" -o "dist/adro-$version.tar.gz"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
