  <style>
    :root {

    .brand-copy strong { display: block; font: 800 15px/1 "JetBrains Mono", monospace; letter-spacing: .16em; }
    .brand-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
    .workspace-picker { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 4px; color: var(--text); background: var(--surface); font-size: 12px; }

    .toolbar input { flex: 1; min-width: 100px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 13px 17px; border-bottom: 1px solid #1d3946; text-align: left; vertical-align: middle; white-space: nowrap; }
    th { color: var(--faint); font: 700 9px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    tbody tr { transition: background .15s ease; }

    td.title-cell { max-width: 390px; overflow: hidden; color: var(--text); font-weight: 600; text-overflow: ellipsis; }
    .mono { color: var(--cyan); font: 11px "JetBrains Mono", monospace; }
    .muted { color: var(--muted); }
    .empty { padding: 46px 17px; color: var(--muted); text-align: center; }
    .status { display: inline-flex; align-items: center; min-height: 21px; padding: 0 8px; border: 1px solid #315161; border-radius: 3px; color: var(--muted); background: #152d39; font: 700 9px "JetBrains Mono", monospace; }
    .status.good { color: var(--green); border-color: #2f765b; background: #12392f; }

    .notice strong { color: var(--amber); }

    async function applyRequirementAction(id,action,version){const button=$('#detailAction');const status=$('#detailStatus');if(button)button.disabled=true;if(status){status.className='detail-status';status.textContent=t('workflowActionRunning');}try{let response;if(action==='start')response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/start`,{method:'POST'});else if(action==='assign'){response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/confirm-assignees`,{method:'POST',headers:{'If-Match':String(version)}});response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/begin-design`,{method:'POST',headers:{'If-Match':String(response.version||version+1)}});}else if(action==='design')response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/gates`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gate:'design',decision:'pass',version})});else if(action==='approve')response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/approve`,{method:'POST'});else if(action==='accept')response=await api(`/api/v1/requirements/${encodeURIComponent(id)}/transition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'ACCEPTED',version})});if(!response)throw new Error('unsupported action');await loadCore(true);const updated=requirements.find(item=>item.id===id);if(updated)await openRequirement(id);if(status)status.textContent=t('workflowActionDone');}catch(_){if(status){status.className='detail-status bad';status.textContent=t('workflowActionFailed');}if(button)button.disabled=false;}}
    async function openRequirement(id){const local=requirements.find(x=>x.id===id);if(!local)return;$('#detailTitle').textContent=local.title;$('#detailKey').textContent=local.key;const actions=requirementActionFor(local.status);const actionMarkup=actions.length?`<div class="detail-actions"><button id="detailAction" class="${actions[0][2]}" type="button" data-action="${actions[0][0]}">${escapeHTML(t(actions[0][1]))}</button></div><div id="detailStatus" class="detail-status" role="status"></div>`:'';$('#detailBody').innerHTML=`<div class="detail-grid"><div><div class="detail-block"><h3>${escapeHTML(t('description'))}</h3><p>${escapeHTML(local.description)}</p></div><div class="detail-block"><h3>${escapeHTML(t('acceptanceCriteria'))}</h3><p>${escapeHTML((local.acceptance_criteria||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')||'-')}</p></div></div><div class="detail-side"><div class="detail-block"><h3>${escapeHTML(t('status'))}</h3><p><span class="status ${statusClass(local.status)}">${escapeHTML(statusLabel(local.status))}</span></p><div class="kpi-row"><span>${escapeHTML(t('version'))}</span><strong>${escapeHTML(local.version||'-')}</strong></div><div class="kpi-row"><span>${escapeHTML(t('assignees'))}</span><strong>${escapeHTML((local.assignee_member_ids||[]).length)}</strong></div><div class="kpi-row"><span>${escapeHTML(t('repositorySet'))}</span><strong>${escapeHTML((local.repository_ids||[]).length)}</strong></div></div></div></div>${actionMarkup}`;$('#detailDialog').showModal();const actionButton=$('#detailAction');if(actionButton)actionButton.onclick=()=>applyRequirementAction(id,actionButton.dataset.action,local.version);try{const detail=await api(`/api/v1/requirements/${encodeURIComponent(id)}`);const evidence=(detail.work_items||[]).map(x=>x.id).join(', ');if(evidence)$('#detailBody .detail-side').insertAdjacentHTML('beforeend',`<div class="detail-block"><h3>${escapeHTML(t('workItems'))}</h3><p class="mono">${escapeHTML(evidence)}</p></div>`);}catch(_){} }

    async function applyResourceAction(kind,id,action){if(kind==='runner'&&action==='execute'){window.adroOpenRunnerExecuteDialog?.(id);return;}const button=document.querySelector(`[data-resource-action="${CSS.escape(action)}"][data-resource-kind="${CSS.escape(kind)}"][data-resource-id="${CSS.escape(id)}"]`);if(button)button.disabled=true;try{let path='',body={};if(kind==='repository'&&action==='index'){path=`/api/v1/repositories/${encodeURIComponent(id)}/index`;body={commit:'working-tree'};}else if(kind==='mcp'){path=`/api/v1/mcp/servers/${encodeURIComponent(id)}/${action==='healthCheck'?'health-check':action}`;if(action==='invoke')path=`/api/v1/mcp/servers/${encodeURIComponent(id)}`;body=action==='invoke'?{tool:'health',request:{source:'adro-webui'}}:{};}else if(kind==='skill'){path=`/api/v1/skills/${encodeURIComponent(id)}/${action}`;body={};}else if(kind==='automation'){path=`/api/v1/automations/${encodeURIComponent(id)}/${action}`;body={};}else if(kind==='runner'){path=`/api/v1/runners/${encodeURIComponent(id)}/${action}`;body=action==='heartbeat'?{active_runs:0}:{};}else if(kind==='bug'){path=`/api/v1/bugs/${encodeURIComponent(id)}/${action}`;body={};}else throw new Error('unsupported action');const result=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(kind==='bug'&&result?.bug){bugs=[...bugs.filter(item=>item.id!==result.bug.id),result.bug];render();}await loadCore(true);}catch(_){if(button){button.disabled=false;button.title=t('actionFailed');}}}

    function renderPipelines(){const stageKeys=['stageDesign','stageDevelopment','stageUnit','stageIntegration','stageArbitration','stageRevalidation','stageReport'];const focus=pipelines.find(x=>!['completed','failed'].includes(x.status))||pipelines.at(-1);const rail=stageKeys.map((key,index)=>{const stage=index+1,cls=focus?(stage<focus.pipeline_stage?'done':stage===focus.pipeline_stage?'active':''):'';return `<div class="pipeline-node ${cls}"><b>0${stage} / 07</b><span>${escapeHTML(t(key))}</span></div>`;}).join('');const rows=pipelines.slice().reverse().map(run=>{const requirement=requirements.find(item=>item.id===run.requirement_id);const statusClassName=run.status==='completed'?'good':run.status==='suspended'?'bad':'active';return `<tr><td><div class="pipeline-session"><strong>${escapeHTML((run.session_id||'').slice(0,12))}</strong><small>${escapeHTML(requirement?.key||run.requirement_id)}</small></div></td><td><span class="status ${statusClassName}">${escapeHTML(pipelineStatusLabel(run.status))}</span></td><td class="mono">${escapeHTML(`${run.pipeline_stage}/7 · ${t(stageKeys[(run.pipeline_stage||1)-1])}`)}</td><td>${escapeHTML(`${run.retry_count||0}/${run.max_retries||0}`)}</td><td class="muted">${escapeHTML(run.context?.current_commit||run.active_provider_issue_id||'-')}</td></tr>`;});return `<div class="view-stack"><div class="menu-intro"><strong>${escapeHTML(t('menuOwned'))}</strong><span>${escapeHTML(t('pipelineCreateHelp'))}</span></div>${focus?`<div class="pipeline-rail">${rail}</div>`:''}${genericTable(t('executionsTitle'),[t('pipelineSession'),t('status'),t('pipelineStage'),t('pipelineRetry'),t('updated')],rows,t('pipelineEmpty'))}</div>`;}

    const createActionFor={bugs:'bug',repositories:'repository',mcp:'mcp',skills:'skill',automations:'automation',runners:'runner'};
    function render(){const meta=pageMeta[currentView]||pageMeta.workbench;$('#pageTitle').textContent=t(meta[0]);$('#pageSubtitle').textContent=t(meta[1]);const createKind=createActionFor[currentView];$('#pageActions').innerHTML=['workbench','requirements'].includes(currentView)?`<button class="primary" id="newRequirement"><span aria-hidden="true">＋</span>${escapeHTML(t('newRequirement'))}</button>`:currentView==='executions'?`<button class="primary" id="newPipeline"><span aria-hidden="true">▶</span>${escapeHTML(t('pipelineCreate'))}</button>`:currentView==='agents'?`<button class="primary" id="newAgent"><span aria-hidden="true">＋</span>${escapeHTML(t('agentCreate'))}</button>`:createKind?`<button class="primary" id="newResource" data-resource-kind="${createKind}"><span aria-hidden="true">＋</span>${escapeHTML(t(resourceConfigs[createKind].title))}</button>`:'';let html='';if(currentView==='workbench')html=renderWorkbench();else if(currentView==='requirements')html=renderRequirements();else if(currentView==='bugs')html=renderBugs();else if(currentView==='executions')html=renderPipelines();else if(['humanQA','designReview','diffs','testing'].includes(currentView))html=renderSimple(currentView);else if(currentView==='repositories')html=renderRepositories();else if(currentView==='agents')html=renderAgents();else if(currentView==='runners')html=renderRunners();else if(['mcp','skills','automations'].includes(currentView))html=renderCapability(currentView);else if(currentView==='integrations')html=renderIntegrations();else if(currentView==='artifacts')html=renderArtifacts();else if(currentView==='cost')html=renderCost();else if(currentView==='admin')html=renderAdmin();else html=`<div class="notice"><strong>${escapeHTML(t('notConfigured'))}</strong><span>${escapeHTML(t('externalBoundaryText'))}</span></div>`;$('#appView').innerHTML=html;bindViewEvents();}
    function bindViewEvents(){const create=$('#newRequirement');if(create)create.onclick=showDialog;const pipelineCreate=$('#newPipeline');if(pipelineCreate)pipelineCreate.onclick=showPipelineDialog;const agentCreate=$('#newAgent');if(agentCreate)agentCreate.onclick=showAgentDialog;const resourceCreate=$('#newResource');if(resourceCreate)resourceCreate.onclick=()=>openResourceDialog(resourceCreate.dataset.resourceKind);document.querySelectorAll('[data-requirement-id]').forEach(row=>{row.onclick=()=>openRequirement(row.dataset.requirementId);row.onkeydown=e=>{if(e.key==='Enter')openRequirement(row.dataset.requirementId);};});document.querySelectorAll('[data-resource-action]').forEach(button=>{button.onclick=e=>{e.stopPropagation();applyResourceAction(button.dataset.resourceKind,button.dataset.resourceId,button.dataset.resourceAction);};});const filter=$('#requirementFilter'),status=$('#statusFilter');const apply=()=>{const term=(filter?.value||'').toLowerCase(),state=status?.value||'';const list=requirements.filter(x=>(!state||x.status===state)&&(!term||`${x.key} ${x.title}`.toLowerCase().includes(term)));const target=$('#requirementRows');if(target)target.innerHTML=requirementRows(list);bindViewEvents();};if(filter)filter.oninput=apply;if(status)status.onchange=apply;const file=$('#screenshotFile');if(file)file.onchange=()=>{if(file.files?.[0])setScreenshotPreview(file.files[0]);};const capture=$('#captureScreenshot');if(capture)capture.onclick=captureScreenshot;const upload=$('#uploadScreenshot');if(upload)upload.onclick=uploadScreenshot;const diagnostics=$('#refreshDiagnostics');if(diagnostics)diagnostics.onclick=loadCore;}
    const toggleLocale=()=>{locale=locale==='zh'?'en':'zh';localStorage.setItem('adro.locale',locale);applyTranslations();};$('#localeToggle').onclick=toggleLocale;$('#loginLocaleToggle').onclick=toggleLocale;$('#refreshButton').onclick=()=>loadCore(true);$('#globalSearch').oninput=render;$('#closeDialog').onclick=closeDialog;$('#cancelDialog').onclick=closeDialog;$('#closeDetail').onclick=()=>$('#detailDialog').close();$('#closeAgentDialog').onclick=closeAgentDialog;$('#cancelAgentDialog').onclick=closeAgentDialog;$('#closeResourceDialog').onclick=closeResourceDialog;$('#cancelResourceDialog').onclick=closeResourceDialog;$('#requirementDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDialog();});$('#detailDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)$('#detailDialog').close();});$('#agentDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAgentDialog();});$('#resourceDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeResourceDialog();});document.querySelectorAll('.nav-item').forEach(button=>button.onclick=()=>{currentView=button.dataset.view;document.querySelectorAll('.nav-item').forEach(item=>item.classList.toggle('active',item===button));render();});$('#requirementForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),repositories=String(f.get('repositories')||'').split(',').map(x=>x.trim()).filter(Boolean),body={workspace_id:'local',title:String(f.get('title')),description:String(f.get('description')),acceptance_criteria:[String(f.get('acceptance'))],assignee_member_ids:[String(f.get('assignee'))],repository_ids:repositories,priority:String(f.get('priority')||'normal')};try{const headers={'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID?.()||String(Date.now())};await api('/api/v1/requirements',{method:'POST',headers,body:JSON.stringify(body)});closeDialog();e.target.reset();await loadCore(true);}catch(_){$('#formError').textContent=t('createFailed');}};$('#agentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),member=String(f.get('member')||'').trim(),name=String(f.get('name')||'').trim(),instructions=String(f.get('instructions')||'').trim(),role=String(f.get('role')||'').trim();try{await api('/api/v1/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace_id:'local',member_id:member,name,instructions,role})});closeAgentDialog();e.target.reset();await loadCore(true);}catch(_){$('#agentFormError').textContent=t('agentSaveFailed');}};$('#resourceForm').onsubmit=async e=>{e.preventDefault();const kind=resourceDialogKind,config=resourceConfigs[kind];if(!config)return;const f=new FormData(e.target),body={workspace_id:'local'};for(const field of config.fields){const value=String(f.get(field[0])||'').trim();if(value)body[field[0]]=field[2]==='number'?Number(value):value;}if(kind==='repository'){body.canonical_name=body.name;delete body.name;body.provider=body.provider||'git';body.default_branch=body.default_branch||'main';}if(kind==='mcp'){body.protocol=body.protocol||'http';body.status='registered';}if(kind==='skill'){body.status='draft';body.contract={};}if(kind==='automation'){try{body.trigger=body.trigger?JSON.parse(body.trigger):{};body.nodes=body.nodes?JSON.parse(body.nodes):[];}catch(_){$('#resourceFormError').textContent=t('resourceSaveFailed');return;}}if(kind==='runner'){delete body.workspace_id;body.version=body.version||'0.1.0';body.capabilities=[];}try{const created=await api(config.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeResourceDialog();e.target.reset();if(kind==='runner'&&created){runners=[...runners.filter(item=>item.id!==created.id),created];render();}await loadCore(true);}catch(_){$('#resourceFormError').textContent=t('resourceSaveFailed');}};applyTranslations();setInterval(()=>{if(!$('#appShell').hidden)loadCore();},20000);
  </script>
  <script>
    $('#closePipelineDialog').onclick=()=>$('#pipelineDialog').close();
    $('#cancelPipelineDialog').onclick=()=>$('#pipelineDialog').close();
    $('#pipelineDialog').addEventListener('click',event=>{if(event.target===event.currentTarget)event.currentTarget.close();});
    $('#pipelineForm').onsubmit=async event=>{
      event.preventDefault();
      const form=new FormData(event.currentTarget);
      const body={
        requirement_id:String(form.get('requirement_id')||''),
        roles:{
          designer_agent_id:String(form.get('designer_agent_id')||'').trim(),
          developer_agent_id:String(form.get('developer_agent_id')||'').trim(),
          tester_agent_id:String(form.get('tester_agent_id')||'').trim(),
          arbitrator_agent_id:String(form.get('arbitrator_agent_id')||'').trim()
        },
        coverage_threshold:Number(form.get('coverage_threshold')||80),
        max_retries:Number(form.get('max_retries')||3)
      };
      try{
        await api('/api/v1/pipelines',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID?.()||String(Date.now())},body:JSON.stringify(body)});
        $('#pipelineDialog').close();
        event.currentTarget.reset();
        await loadCore(true);
      }catch(_){$('#pipelineFormError').textContent=t('pipelineCreateFailed');}
    };
  </script>
  <script src="enhancements.js"></script>
