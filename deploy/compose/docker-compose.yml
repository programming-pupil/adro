services:
  adro:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${ADRO_API_PORT:-8080}:8080"
    volumes:
      - adro-data:/var/lib/adro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # This compose file is deliberately a single-node profile. A second
      # replica is unsafe until the external backends below are installed and
      # conformance-tested; the API rejects production-shaped fallbacks.
      ADRO_PROFILE: ${ADRO_PROFILE:-single-node}
      ADRO_REPLICA_COUNT: ${ADRO_REPLICA_COUNT:-1}
      ADRO_PERSISTENCE_BACKEND: ${ADRO_PERSISTENCE_BACKEND:-file}
      ADRO_EVENT_BACKEND: ${ADRO_EVENT_BACKEND:-memory}
      ADRO_WORKFLOW_BACKEND: ${ADRO_WORKFLOW_BACKEND:-in-process}
      ADRO_ARTIFACT_BACKEND: ${ADRO_ARTIFACT_BACKEND:-filesystem}
      ADRO_AUTH_BACKEND: ${ADRO_AUTH_BACKEND:-local}
      ADRO_SECRET_STORE: ${ADRO_SECRET_STORE:-environment}
      ADRO_RUNNER_MODE: ${ADRO_RUNNER_MODE:-argv}
      ADRO_SOURCE_CONTROL: ${ADRO_SOURCE_CONTROL:-none}
      ADRO_CI_BACKEND: ${ADRO_CI_BACKEND:-none}
      ADRO_AUTH_MODE: required
      ADRO_ADMIN_USERNAME: ${ADRO_ADMIN_USERNAME:-admin}
      ADRO_ADMIN_PASSWORD: ${ADRO_ADMIN_PASSWORD:?ADRO_ADMIN_PASSWORD must be set}
      ADRO_AUTH_STATE_FILE: /var/lib/adro/auth.json
      ADRO_STATE_FILE: /var/lib/adro/control-plane.json
      ADRO_EVENT_STATE_FILE: /var/lib/adro/events.json
      ADRO_AUDIT_STATE_FILE: /var/lib/adro/audit.json
      ADRO_RUNNER_STATE_FILE: /var/lib/adro/runners.json
      ADRO_ARTIFACT_ROOT: /var/lib/adro/artifacts
      ADRO_PROVIDER: ${ADRO_PROVIDER:-multica}
      ADRO_MULTICA_URL: ${ADRO_MULTICA_URL:-}
      ADRO_MULTICA_TOKEN: ${ADRO_MULTICA_TOKEN:-}
      ADRO_MULTICA_AGENT_ID: ${ADRO_MULTICA_AGENT_ID:-}
      ADRO_MULTICA_WORKSPACE_ID: ${ADRO_MULTICA_WORKSPACE_ID:-}
      ADRO_MULTICA_RUNTIME_ID: ${ADRO_MULTICA_RUNTIME_ID:-}
      ADRO_MULTICA_PROJECT_ID: ${ADRO_MULTICA_PROJECT_ID:-}
      ADRO_MULTICA_AGENT_MAP: ${ADRO_MULTICA_AGENT_MAP:-}
      ADRO_MULTICA_CAPABILITIES_PATH: ${ADRO_MULTICA_CAPABILITIES_PATH:-}
      ADRO_MULTICA_ATTACHMENT_PATH: ${ADRO_MULTICA_ATTACHMENT_PATH:-}
      ADRO_MULTICA_WS_URL: ${ADRO_MULTICA_WS_URL:-}
  web:
    image: nginx:1.27-alpine
    depends_on:
      - adro
    ports:
      - "${ADRO_WEB_PORT:-8081}:80"
    volumes:
      - ../../apps/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  adro-data:
