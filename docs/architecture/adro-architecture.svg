<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ADRO architecture map</title>
  <desc id="desc">Layered architecture showing the experience edge, control plane, execution plane, and durable state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1d32"/><stop offset="1" stop-color="#10263a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132d46" stop-opacity=".96"/><stop offset="1" stop-color="#0b1a2b" stop-opacity=".96"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58e6ff"/><stop offset="1" stop-color="#65a9ff"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c6f36b"/><stop offset="1" stop-color="#65e6c1"/></linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowLime" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#70a9bf" stroke-opacity=".09"/><circle cx="1" cy="1" r="1.2" fill="#8be9ff" fill-opacity=".18"/></pattern>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#62ddff"/></marker>
    <marker id="arrowLime" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c6f36b"/></marker>
    <style>
      .title{font:700 42px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:5px;fill:#f2fbff}.kicker{font:600 13px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:3px;fill:#69dff7}.lane{font:700 14px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:2px;fill:#9fc7d6}.nodeTitle{font:700 19px 'Avenir Next','Segoe UI',sans-serif;fill:#f1fbff}.nodeSub{font:500 13px 'Avenir Next','Segoe UI',sans-serif;fill:#9cc0cb}.chip{font:600 11px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:1px;fill:#c9f5ff}.foot{font:600 13px 'Avenir Next','Segoe UI',sans-serif;fill:#bed6df}.node{fill:url(#panel);stroke:#2e5b73;stroke-width:1.5}.nodeAccent{stroke:#5cdef8;stroke-width:2}.nodeAccentLime{stroke:#bfe96b;stroke-width:2}.wire{fill:none;stroke:#5dddf9;stroke-width:2.4;marker-end:url(#arrowCyan);opacity:.9}.wireLime{fill:none;stroke:#c6f36b;stroke-width:2.4;marker-end:url(#arrowLime);opacity:.9}.wireDash{fill:none;stroke:#7dc9df;stroke-width:1.5;stroke-dasharray:7 8;opacity:.7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="26" fill="url(#grid)" stroke="#23475f" stroke-width="1.5"/><path d="M74 140H1526" stroke="#69dff7" stroke-opacity=".22"/>
  <text x="76" y="82" class="kicker">SYSTEM BLUEPRINT / 01</text><text x="76" y="126" class="title">ADRO ARCHITECTURE</text><text x="1524" y="86" text-anchor="end" class="kicker">DURABLE DELIVERY CONTROL PLANE</text>
  <text x="78" y="178" class="lane">EXPERIENCE EDGE</text><text x="474" y="178" class="lane">CONTROL PLANE</text><text x="1010" y="178" class="lane">EXECUTION PLANE</text><text x="1312" y="178" class="lane">DURABLE STATE</text>
  <rect x="70" y="202" width="320" height="560" rx="18" fill="#091725" fill-opacity=".72" stroke="#24485b"/><rect x="454" y="202" width="500" height="560" rx="18" fill="#091725" fill-opacity=".72" stroke="#24485b"/><rect x="990" y="202" width="286" height="560" rx="18" fill="#091725" fill-opacity=".72" stroke="#24485b"/><rect x="1308" y="202" width="220" height="560" rx="18" fill="#091725" fill-opacity=".72" stroke="#24485b"/>
  <g><rect class="node nodeAccent" x="98" y="238" width="264" height="104" rx="12"/><circle cx="124" cy="266" r="7" fill="#63e5ff" filter="url(#glowCyan)"/><text x="146" y="274" class="nodeTitle">Owned workbench</text><text x="122" y="300" class="nodeSub">goal intake, review, delivery graph</text><text x="122" y="323" class="chip">BROWSER / ACCESSIBILITY / I18N</text></g>
  <g><rect class="node" x="98" y="372" width="264" height="104" rx="12"/><circle cx="124" cy="400" r="7" fill="#65a9ff"/><text x="146" y="408" class="nodeTitle">REST + OpenAPI</text><text x="122" y="434" class="nodeSub">versioned commands and contracts</text><text x="122" y="457" class="chip">IDEMPOTENT MUTATIONS</text></g>
  <g><rect class="node" x="98" y="506" width="264" height="104" rx="12"/><circle cx="124" cy="534" r="7" fill="#c6f36b" filter="url(#glowLime)"/><text x="146" y="542" class="nodeTitle">Event stream</text><text x="122" y="568" class="nodeSub">cursor replay and live projections</text><text x="122" y="591" class="chip">TENANT-SCOPED TOPICS</text></g>
  <g><rect class="node" x="98" y="640" width="264" height="86" rx="12"/><text x="122" y="673" class="nodeTitle">CLI + integrations</text><text x="122" y="700" class="nodeSub">webhook, chat, artifact links</text></g>
  <g><rect class="node nodeAccent" x="482" y="238" width="444" height="104" rx="12"/><circle cx="512" cy="266" r="7" fill="#63e5ff" filter="url(#glowCyan)"/><text x="534" y="274" class="nodeTitle">Authenticated control API</text><text x="510" y="300" class="nodeSub">tenant, member, project, policy, resource boundaries</text><text x="510" y="323" class="chip">AUTHZ FIRST / FAIL CLOSED</text></g>
  <g><rect class="node" x="482" y="372" width="210" height="104" rx="12"/><text x="510" y="408" class="nodeTitle">Domain kernel</text><text x="510" y="434" class="nodeSub">facts, transitions,</text><text x="510" y="454" class="nodeSub">idempotency, audit</text></g>
  <g><rect class="node nodeAccentLime" x="716" y="372" width="210" height="104" rx="12"/><text x="744" y="408" class="nodeTitle">Workflow engine</text><text x="744" y="434" class="nodeSub">ordered stages, gates,</text><text x="744" y="454" class="nodeSub">retry and repair loops</text></g>
  <g><rect class="node" x="482" y="506" width="210" height="104" rx="12"/><text x="510" y="542" class="nodeTitle">Evidence ledger</text><text x="510" y="568" class="nodeSub">commit, test, deploy,</text><text x="510" y="588" class="nodeSub">artifact assertions</text></g>
  <g><rect class="node" x="716" y="506" width="210" height="104" rx="12"/><text x="744" y="542" class="nodeTitle">Plugin registry</text><text x="744" y="568" class="nodeSub">signed manifests,</text><text x="744" y="588" class="nodeSub">capabilities, health</text></g>
  <g><rect class="node" x="482" y="640" width="444" height="86" rx="12"/><text x="510" y="673" class="nodeTitle">Policy + audit boundary</text><text x="510" y="700" class="nodeSub">every state change has actor, version, timestamp and reason</text></g>
  <g><rect class="node nodeAccentLime" x="1018" y="238" width="230" height="104" rx="12"/><circle cx="1048" cy="266" r="7" fill="#c6f36b" filter="url(#glowLime)"/><text x="1070" y="274" class="nodeTitle">Session harness</text><text x="1046" y="300" class="nodeSub">transcript, context,</text><text x="1046" y="320" class="nodeSub">memory, compaction</text></g>
  <g><rect class="node" x="1018" y="372" width="230" height="104" rx="12"/><text x="1046" y="408" class="nodeTitle">Execution gateway</text><text x="1046" y="434" class="nodeSub">provider-neutral calls,</text><text x="1046" y="454" class="nodeSub">timeouts and receipts</text></g>
  <g><rect class="node" x="1018" y="506" width="230" height="104" rx="12"/><text x="1046" y="542" class="nodeTitle">Runner supervisor</text><text x="1046" y="568" class="nodeSub">bounded process, lease,</text><text x="1046" y="588" class="nodeSub">isolated worktree</text></g>
  <g><rect class="node" x="1018" y="640" width="230" height="86" rx="12"/><text x="1046" y="673" class="nodeTitle">External adapters</text><text x="1046" y="700" class="nodeSub">Git, CI, deploy, notify</text></g>
  <g><rect class="node nodeAccent" x="1336" y="238" width="164" height="104" rx="12"/><text x="1358" y="274" class="nodeTitle">Transcript</text><text x="1358" y="300" class="nodeSub">append-only</text><text x="1358" y="320" class="nodeSub">hash chain</text></g>
  <g><rect class="node" x="1336" y="372" width="164" height="104" rx="12"/><text x="1358" y="408" class="nodeTitle">Checkpoints</text><text x="1358" y="434" class="nodeSub">tool pairs</text><text x="1358" y="454" class="nodeSub">recovery proof</text></g>
  <g><rect class="node" x="1336" y="506" width="164" height="104" rx="12"/><text x="1358" y="542" class="nodeTitle">Memory</text><text x="1358" y="568" class="nodeSub">working, session,</text><text x="1358" y="588" class="nodeSub">project tiers</text></g>
  <g><rect class="node" x="1336" y="640" width="164" height="86" rx="12"/><text x="1358" y="673" class="nodeTitle">Artifacts</text><text x="1358" y="700" class="nodeSub">outbox + reports</text></g>
  <path class="wire" d="M362 290H482"/><path class="wire" d="M362 424H482"/><path class="wire" d="M362 558H482"/><path class="wire" d="M704 424H716"/><path class="wire" d="M692 424H1018"/><path class="wireLime" d="M926 424H1018"/><path class="wire" d="M926 558H1018V558"/><path class="wire" d="M1133 476V506"/><path class="wireLime" d="M1133 342V372"/><path class="wire" d="M1248 558H1336"/><path class="wireLime" d="M1248 290H1336"/><path class="wireDash" d="M1500 290C1560 290 1560 760 1248 760C1060 760 926 760 926 683"/><path class="wireDash" d="M1336 424C1290 424 1276 424 1248 424"/>
  <circle cx="462" cy="290" r="4" fill="#62ddff" filter="url(#glowCyan)"/><circle cx="998" cy="424" r="4" fill="#c6f36b" filter="url(#glowLime)"/><circle cx="1318" cy="290" r="4" fill="#62ddff" filter="url(#glowCyan)"/>
  <rect x="70" y="800" width="1458" height="40" rx="20" fill="#0c2133" stroke="#315b70"/><circle cx="98" cy="820" r="5" fill="#c6f36b" filter="url(#glowLime)"/><text x="118" y="825" class="foot">INVARIANT  /  durable intent before side effect  /  proven continuity before repair  /  unknown never becomes success</text>
</svg>
