<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ADRO capability map</title>
  <desc id="desc">A radial map of delivery capabilities around the ADRO delivery graph, including workflow, agents, memory, quality, repair, chat, evidence, and governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100d1f"/><stop offset=".5" stop-color="#13213c"/><stop offset="1" stop-color="#102d38"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="70%"><stop stop-color="#2d5b70"/><stop offset=".58" stop-color="#173447"/><stop offset="1" stop-color="#0b1b2d"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9eb8d2" stroke-opacity=".1"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#72dff4"/></marker>
    <style>
      .title{font:700 42px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:5px;fill:#f6fbff}.kicker{font:600 13px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:3px;fill:#72dff4}.label{font:700 17px 'Avenir Next','Segoe UI',sans-serif;fill:#f4fbff}.sub{font:500 12px 'Avenir Next','Segoe UI',sans-serif;fill:#acc5d0}.coreTitle{font:700 28px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:3px;fill:#fff}.coreSub{font:600 12px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:2px;fill:#bceef4}.small{font:600 11px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:1.5px;fill:#d9f7ff}.card{fill:#0d1d31;fill-opacity:.95;stroke:#315a71;stroke-width:1.5}.wire{fill:none;stroke:#72dff4;stroke-width:2;marker-end:url(#arrow);opacity:.84}.wireDash{fill:none;stroke:#b9d2db;stroke-width:1.4;stroke-dasharray:6 8;opacity:.55}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="944" rx="26" fill="url(#grid)" stroke="#3b526d" stroke-width="1.5"/>
  <text x="76" y="82" class="kicker">CAPABILITY CONSTELLATION / 02</text><text x="76" y="126" class="title">ADRO DELIVERY GRAPH</text><text x="1524" y="86" text-anchor="end" class="kicker">FROM INTENT TO PROOF</text><path d="M74 150H1526" stroke="#72dff4" stroke-opacity=".22"/>
  <circle cx="800" cy="510" r="222" fill="none" stroke="#72dff4" stroke-opacity=".17" stroke-width="2" stroke-dasharray="5 12"/><circle cx="800" cy="510" r="173" fill="none" stroke="#d2f66d" stroke-opacity=".18" stroke-width="2"/><circle cx="800" cy="510" r="128" fill="url(#core)" stroke="#72e6f6" stroke-width="2.5" filter="url(#glow)"/><circle cx="800" cy="510" r="99" fill="none" stroke="#d2f66d" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/>
  <text x="800" y="500" text-anchor="middle" class="coreTitle">ADRO</text><text x="800" y="528" text-anchor="middle" class="coreSub">DELIVERY GRAPH</text><text x="800" y="550" text-anchor="middle" class="small">ONE CONTEXT / MANY PATHS</text>
  <g><rect class="card" x="92" y="224" width="286" height="128" rx="14" stroke="#72dff4"/><rect x="92" y="224" width="7" height="128" rx="3" fill="#72dff4"/><text x="120" y="264" class="label">Goal intake</text><text x="120" y="290" class="sub">requirements, bugs, analysis</text><text x="120" y="312" class="sub">attachments, criteria, ownership</text><text x="120" y="334" class="small">START WITH INTENT</text></g>
  <g><rect class="card" x="472" y="190" width="286" height="128" rx="14" stroke="#ff91d1"/><rect x="472" y="190" width="7" height="128" rx="3" fill="#ff91d1"/><text x="500" y="230" class="label">Workflow studio</text><text x="500" y="256" class="sub">automatic or design approval</text><text x="500" y="278" class="sub">optional stages and retry policy</text><text x="500" y="300" class="small">COMPOSE THE PATH</text></g>
  <g><rect class="card" x="842" y="190" width="286" height="128" rx="14" stroke="#d2f66d"/><rect x="842" y="190" width="7" height="128" rx="3" fill="#d2f66d"/><text x="870" y="230" class="label">Agent team routing</text><text x="870" y="256" class="sub">planner, developer, tester, analyst</text><text x="870" y="278" class="sub">capacity, permissions, role binding</text><text x="870" y="300" class="small">SELECT THE ACTOR</text></g>
  <g><rect class="card" x="1222" y="224" width="286" height="128" rx="14" stroke="#72dff4"/><rect x="1222" y="224" width="7" height="128" rx="3" fill="#72dff4"/><text x="1250" y="264" class="label">Session memory</text><text x="1250" y="290" class="sub">transcript, context, compaction</text><text x="1250" y="312" class="sub">working, session, project tiers</text><text x="1250" y="334" class="small">KEEP THE THREAD</text></g>
  <g><rect class="card" x="82" y="536" width="286" height="128" rx="14" stroke="#d2f66d"/><rect x="82" y="536" width="7" height="128" rx="3" fill="#d2f66d"/><text x="110" y="576" class="label">Quality gates</text><text x="110" y="602" class="sub">unit, integration, coverage, health</text><text x="110" y="624" class="sub">evidence required before advance</text><text x="110" y="646" class="small">PROVE THE RESULT</text></g>
  <g><rect class="card" x="1228" y="536" width="286" height="128" rx="14" stroke="#ff91d1"/><rect x="1228" y="536" width="7" height="128" rx="3" fill="#ff91d1"/><text x="1256" y="576" class="label">Repair loop</text><text x="1256" y="602" class="sub">failed evidence returns to context</text><text x="1256" y="624" class="sub">bounded retries and escalation</text><text x="1256" y="646" class="small">RECOVER, DO NOT RESET</text></g>
  <g><rect class="card" x="472" y="702" width="286" height="128" rx="14" stroke="#72dff4"/><rect x="472" y="702" width="7" height="128" rx="3" fill="#72dff4"/><text x="500" y="742" class="label">Evidence + report</text><text x="500" y="768" class="sub">commits, logs, artifacts, decisions</text><text x="500" y="790" class="sub">release-ready audit bundle</text><text x="500" y="812" class="small">END WITH PROOF</text></g>
  <g><rect class="card" x="842" y="702" width="286" height="128" rx="14" stroke="#d2f66d"/><rect x="842" y="702" width="7" height="128" rx="3" fill="#d2f66d"/><text x="870" y="742" class="label">Chat + threads</text><text x="870" y="768" class="sub">ordinary discussion with project binding</text><text x="870" y="790" class="sub">durable turns, mentions, follow-ups</text><text x="870" y="812" class="small">TALK WITHOUT LOSING CONTEXT</text></g>
  <path class="wire" d="M378 288C500 300 576 350 680 416"/><path class="wire" d="M615 318C652 366 704 386 742 405"/><path class="wire" d="M985 318C950 366 906 386 858 405"/><path class="wire" d="M1222 288C1100 300 1024 350 920 416"/><path class="wire" d="M368 600C500 600 580 575 682 558"/><path class="wire" d="M1228 600C1100 600 1020 575 918 558"/><path class="wire" d="M615 702C654 658 710 640 748 620"/><path class="wire" d="M985 702C946 658 890 640 852 620"/><path class="wireDash" d="M227 352C210 448 220 508 227 536"/><path class="wireDash" d="M1370 352C1388 448 1380 508 1370 536"/>
  <circle cx="800" cy="376" r="5" fill="#72dff4" filter="url(#glow)"/><circle cx="800" cy="644" r="5" fill="#d2f66d" filter="url(#glow)"/><rect x="92" y="890" width="1416" height="42" rx="21" fill="#0d2031" stroke="#3c5e70"/><text x="800" y="917" text-anchor="middle" class="small">INTAKE  -&gt;  PLAN  -&gt;  BUILD  -&gt;  VERIFY  -&gt;  REPAIR  -&gt;  REPORT  |  EVERY STEP LEAVES EVIDENCE</text>
</svg>
