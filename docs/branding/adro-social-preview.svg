<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ADRO - auditable agent delivery</title>
  <desc id="desc">GitHub social preview for ADRO, an auditable and recoverable software delivery control plane.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020915" stop-opacity=".98"/>
      <stop offset=".46" stop-color="#04101d" stop-opacity=".88"/>
      <stop offset=".78" stop-color="#04101d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#04101d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6be5f9"/>
      <stop offset="1" stop-color="#d3f76c"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow{font:600 16px 'Avenir Next','Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#9de7f1}
      .word{font:800 132px 'Avenir Next','Segoe UI',Arial,sans-serif;letter-spacing:18px;fill:#effdff}
      .line{font:700 27px 'Avenir Next','Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#d9faff}
      .body{font:500 18px 'Avenir Next','Segoe UI',Arial,sans-serif;letter-spacing:.5px;fill:#b4d7df}
      .chip{font:700 13px 'Avenir Next','Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#d3f76c}
    </style>
  </defs>

  <image x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice" xlink:href="adro-social-bg.png"/>
  <rect width="1280" height="640" fill="url(#shade)"/>
  <rect x="28" y="28" width="1224" height="584" rx="18" fill="none" stroke="#77e9f8" stroke-opacity=".34"/>
  <path d="M76 126H612" stroke="#77e9f8" stroke-opacity=".42"/>
  <text x="78" y="102" class="eyebrow">ADRO / OPEN SOURCE DELIVERY CONTROL PLANE</text>
  <text x="78" y="282" class="word">ADRO</text>
  <text x="84" y="334" class="line">AUDITABLE AGENTS. RECOVERABLE WORKFLOWS.</text>
  <text x="84" y="378" class="body">From intent to evidence, with continuity built in.</text>

  <g transform="translate(84 480)">
    <rect x="0" y="0" width="132" height="42" rx="21" fill="#071a28" stroke="#346778"/>
    <rect x="146" y="0" width="138" height="42" rx="21" fill="#071a28" stroke="#346778"/>
    <rect x="298" y="0" width="132" height="42" rx="21" fill="#071a28" stroke="#346778"/>
    <rect x="444" y="0" width="122" height="42" rx="21" fill="#071a28" stroke="#346778"/>
    <circle cx="20" cy="21" r="5" fill="#d3f76c" filter="url(#softGlow)"/>
    <circle cx="166" cy="21" r="5" fill="#6be5f9" filter="url(#softGlow)"/>
    <circle cx="318" cy="21" r="5" fill="#d7a5ff" filter="url(#softGlow)"/>
    <circle cx="464" cy="21" r="5" fill="#d3f76c" filter="url(#softGlow)"/>
    <text x="34" y="26" class="chip">WORKFLOWS</text>
    <text x="180" y="26" class="chip">CONTEXT</text>
    <text x="332" y="26" class="chip">EVIDENCE</text>
    <text x="478" y="26" class="chip">RELEASES</text>
  </g>
  <g transform="translate(1160 76)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#071a28" stroke="url(#edge)" stroke-width="2"/>
    <path d="M12 22h20M22 12v20" stroke="#effdff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
