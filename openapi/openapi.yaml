components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: adro_session
  parameters:
    WorkspaceID:
      name: X-Workspace-ID
      in: header
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional for POST, PUT, and PATCH. Scope is tenant + method + path.
        Reuse with the same query, content type, and body replays the first completed
        response; reuse with different input returns 409 idempotency_key_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    WorkflowStep:
      type: object
      required:
      - id
      - stage
      - agent_id
      properties:
        id:
          type: string
        stage:
          type: integer
          minimum: 1
          maximum: 7
        name:
          type: string
        role:
          type: string
        agent_id:
          type: string
        required:
          type: boolean
        retry_limit:
          type: integer
          minimum: 0
        config:
          type: object
          additionalProperties: true
    WorkflowTemplate:
      type: object
      required:
      - workspace_id
      - name
      - mode
      - steps
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
          - automatic
          - design_approval
        steps:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/WorkflowStep"
        version:
          type: integer
          minimum: 1
    ChatSessionCreate:
      type: object
      required:
      - workspace_id
      - title
      properties:
        workspace_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        budget_tokens:
          type: integer
          minimum: 0
        auto_compaction:
          type: boolean
        compaction_threshold:
          type: number
          minimum: 0
          maximum: 1
        compaction_retain_tail:
          type: integer
          minimum: 0
    ChatSession:
      type: object
      required:
      - id
      - workspace_id
      - title
      - harness_session_id
      - status
      properties:
        id:
          type: string
        workspace_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        harness_session_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatMessageCreate:
      type: object
      required:
      - content
      properties:
        content:
          type: string
