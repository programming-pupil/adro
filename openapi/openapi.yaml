---
openapi: 3.1.0
info:
  title: ADRO Control API
  version: 0.1.0
  description: Provider-independent Agentic Delivery & Release Orchestrator API.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
- url: "/"
security:
- bearerAuth: []
- cookieAuth: []
paths:
  "/api/v1/auth/login":
    post:
      security: []
      summary: Authenticate an ADRO user and set an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '429':
          description: Login temporarily locked
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/auth/me":
    get:
      security: []
      summary: Read the current interactive or machine identity
      responses:
        '200':
          description: Current identity and available menu catalog
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/auth/logout":
    post:
      summary: Revoke the current session and clear its cookie
      responses:
        '204':
          description: Logged out
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/users":
    get:
      summary: List users and menu catalog (administrator only)
      responses:
        '200':
          description: User page and all menu identifiers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '403':
          description: Administrator required
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      summary: Create a user with role, status, and menu access (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserMutation"
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Invalid account definition
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Update role, status, password, or menu access (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserMutation"
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Invalid update or last active administrator
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/directory":
    get:
      summary: List active workspace identities for assignee selectors
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/attachments":
    get:
      summary: List attachments linked to a requirement or bug
      parameters:
      - name: owner_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - requirement
          - bug
      - name: owner_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attachment page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      summary: Upload and link an attachment to a requirement or bug
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - owner_type
              - owner_id
              - file
              properties:
                owner_type:
                  type: string
                  enum:
                  - requirement
                  - bug
                owner_id:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Immutable entity attachment
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EntityAttachment"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/provider/diagnostics":
    get:
      summary: Probe provider capabilities, health, and attachment support
      responses:
        '200':
          description: Secret-free provider diagnostics
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderDiagnostics"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/system/diagnostics":
    get:
      summary: Report selected backends and durable recovery boundaries
      responses:
        '200':
          description: Secret-free system diagnostics
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemDiagnostics"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/healthz":
    get:
      security: []
      summary: Report control-plane process health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/metrics":
    get:
      security: []
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema:
                type: string
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            text/plain:
              schema:
                type: string
  "/readyz":
    get:
      security: []
      summary: Report provider and control-plane readiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/requirements":
    get:
      summary: List requirements
      parameters:
      - "$ref": "#/components/parameters/WorkspaceID"
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 250
      responses:
        '200':
          description: Requirement page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      summary: Create a requirement
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RequirementCreate"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '409':
          description: Duplicate key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/requirements/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get requirement
      responses:
        '200':
          description: Requirement
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    patch:
      summary: Update requirement
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/comments/{id}/follow-up":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Read durable comment follow-up execution status
      responses:
        '200':
          description: Follow-up receipt
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Retry or dispatch a comment follow-up
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/RequestID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '202':
          description: Follow-up queued or started
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/requirements/{id}/comments":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List requirement discussion comments
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 250
      responses:
        '200':
          description: Comment page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommentPage"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Add a requirement comment or reply and optionally dispatch a follow-up
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommentCreate"
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/requirements/{id}/start":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Start workflow
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '409':
          description: Invalid transition
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/requirements/{id}/transition":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Apply a validated requirement state transition
      responses:
        '200':
          description: Transitioned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '409':
          description: Invalid transition
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/requirements/{id}/gates":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Apply a deterministic quality gate and optionally create a bug
      responses:
        '200':
          description: Gate result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '409':
          description: Gate rejected
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/requirements/{id}/approve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Approve design
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/requirements/{id}/confirm-assignees":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Confirm requirement assignees
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/requirements/{id}/begin-design":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Begin design
      responses:
        '200':
