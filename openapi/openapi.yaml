components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: adro_session
  parameters:
    WorkspaceID:
      name: X-Workspace-ID
      in: header
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional for POST, PUT, and PATCH. Scope is tenant + method + path.
        Reuse with the same query, content type, and body replays the first completed
        response; reuse with different input returns 409 idempotency_key_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    HarnessSessionCreate:
      type: object
      required: [workspace_id]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        project_id:
          type: string
          description: Optional deterministic project-memory namespace shared by sessions.
        budget_tokens:
          type: integer
          minimum: 0
        auto_compaction:
          type: boolean
        compaction_threshold:
          type: number
          minimum: 0
          maximum: 1
        compaction_retain_tail:
          type: integer
          minimum: 0
    HarnessMemoryItem:
      type: object
      required: [kind, content, source_ids, confidence]
      properties:
        scope:
          type: string
          enum: [working, session, project]
          default: session
        project_id:
          type: string
        kind:
          type: string
        fingerprint:
          type: string
        content:
          type: string
        source_ids:
          type: array
          minItems: 1
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        importance:
          type: number
          minimum: 0
          maximum: 1
        pinned:
          type: boolean
        expires_at:
          type: string
          format: date-time
        supersedes:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
    Session:
      type: object
      required:
      - user
      - token
      - expires_at
      properties:
        user:
          "$ref": "#/components/schemas/User"
        token:
          type: string
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - workspace_id
      - username
      - display_name
      - role
      - menu_ids
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - admin
          - member
          - viewer
        menu_ids:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - disabled
