---
openapi: 3.1.0
info:
  title: ADRO Control API
  version: 0.1.0
  description: Provider-independent Agentic Delivery & Release Orchestrator API.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
- url: "/"
security:
- bearerAuth: []
- cookieAuth: []
paths:
  "/api/v1/execution-plans":
    get:
      operationId: get_api_v1_execution_plans
      summary: List immutable execution plans in a workspace
      responses:
        '200':
          description: Execution plans
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/execution-plans/{plan_id}":
    get:
      operationId: get_api_v1_execution_plans_by_plan_id
      summary: Get a frozen execution plan
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution plan
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/execution-plans/{plan_id}/timeline":
    get:
      operationId: get_api_v1_execution_plans_by_plan_id_timeline
      summary: Read immutable plan events for replay and diagnostics
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Plan timeline
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/execution-plans/{plan_id}/replay":
    get:
      operationId: get_api_v1_execution_plans_by_plan_id_replay
      summary: Rebuild a projection from a frozen plan and its immutable events
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Replayed plan projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/execution-plans/{plan_id}/tick":
    post:
      operationId: post_api_v1_execution_plans_by_plan_id_tick
      summary: Advance one durable graph scheduler tick
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '200':
          description: Scheduler report and projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
  "/api/v1/execution-plans/{plan_id}/nodes/{node_id}/approve":
    post:
      operationId: post_api_v1_execution_plans_by_plan_id_nodes_by_node_id_approve
      summary: Approve a waiting human graph node
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '200':
          description: Approved attempt and updated projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
  "/api/v1/execution-plans/{plan_id}/nodes/{node_id}/deny":
    post:
      operationId: post_api_v1_execution_plans_by_plan_id_nodes_by_node_id_deny
      summary: Deny a waiting human graph node
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '200':
          description: Denied attempt and updated projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/execution-plans/{plan_id}/{action}":
    parameters:
    - name: plan_id
      in: path
      required: true
      schema:
        type: string
    - name: action
      in: path
      required: true
      schema:
        type: string
        enum:
        - cancel
        - retry
        - takeover
        - resume
    post:
      operationId: post_api_v1_execution_plans_by_plan_id_by_action
      summary: Apply an explicit execution plan lifecycle action
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '200':
          description: Lifecycle action result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/workspaces/{workspace_id}/agents":
    get:
      operationId: get_api_v1_workspaces_by_workspace_id_agents
      summary: List revisioned orchestration agents
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent definitions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      operationId: post_api_v1_workspaces_by_workspace_id_agents
      summary: Create an agent definition draft
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/squads":
    get:
      operationId: get_api_v1_squads
      summary: List revisioned squads
      responses:
        '200':
          description: Squad definitions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      operationId: post_api_v1_squads
      summary: Create a squad draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '201':
          description: Squad created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/runtimes/discovered":
    get:
      operationId: get_api_v1_runtimes_discovered
      summary: Discover installed local execution runtimes
      responses:
        '200':
          description: Runtime discovery result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/runtimes/{runtime_id}/models":
    get:
      operationId: get_api_v1_runtimes_by_runtime_id_models
      summary: Discover the model and per-model execution option catalog
      parameters:
      - name: runtime_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model, thinking-level, and service-tier catalog
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/workspaces/{workspace_id}/agents/import":
    post:
      operationId: post_api_v1_workspaces_by_workspace_id_agents_import
      summary: Atomically validate or import a versioned workspace definition bundle
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '200':
          description: Bundle validated or replayed without new definitions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        '201':
          description: Bundle imported atomically
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/execution-plans/validate":
    post:
      operationId: post_api_v1_execution_plans_validate
      summary: Validate a graph execution plan without executing it
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '200':
          description: Validated graph and deterministic digest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Graph validation failure
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
  "/api/v1/requirements/{id}/comments/trigger-preview":
    post:
      operationId: post_api_v1_requirements_by_id_comments_trigger_preview
      summary: Preview structured Agent/Squad comment triggers
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        '200':
          description: Per-target trigger outcomes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Invalid structured mention
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
  "/api/v1/auth/login":
    post:
      operationId: post_api_v1_auth_login
      security: []
      summary: Authenticate an ADRO user and set an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '429':
          description: Login temporarily locked
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/auth/me":
    get:
      operationId: get_api_v1_auth_me
      security: []
      summary: Read the current interactive or machine identity
      responses:
        '200':
          description: Current identity and available menu catalog
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/auth/logout":
    post:
      operationId: post_api_v1_auth_logout
      summary: Revoke the current session and clear its cookie
      responses:
        '204':
          description: Logged out
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/users":
    get:
      operationId: get_api_v1_users
      summary: List users and menu catalog (administrator only)
      responses:
        '200':
          description: User page and all menu identifiers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        '403':
          description: Administrator required
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
    post:
      operationId: post_api_v1_users
      summary: Create a user with role, status, and menu access (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserMutation"
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Invalid account definition
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      operationId: patch_api_v1_users_by_id
      summary: Update role, status, password, or menu access (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserMutation"
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Idempotency-Replayed:
              "$ref": "#/components/headers/IdempotencyReplayed"
        '422':
          description: Invalid update or last active administrator
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/directory":
    get:
      operationId: get_api_v1_directory
      summary: List active workspace identities for assignee selectors
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
  "/api/v1/attachments":
    get:
      operationId: get_api_v1_attachments
      summary: List attachments linked to a requirement or bug
      parameters:
      - name: owner_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - requirement
          - bug
      - name: owner_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attachment page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonObject"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
        default:
          description: Problem Details response
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
          content:
            application/problem+json:
